plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.obhoyhardwaretrigger'
version = '0.1.0'

android {
  namespace "expo.modules.obhoyhardwaretrigger"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation("com.facebook.react:react-android")
}